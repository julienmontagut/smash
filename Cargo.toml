[package]
name = "kosh"
version = "0.1.1"
authors = ["Julien Montagut <code@julienmontagut.com>"]
edition = "2021"
license = "MIT"
description = "An opinionated shell with a focus on simplicity and performance"
readme = "README.md"

# See more keys and their definitions at
# https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = "4.0.26"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.48.0", features = ["Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.140"
